[package]
name = "lenso-agent"
version = "0.1.0"
description = "Optional JSON and MCP adapter for explicitly selected Lenso Framework commands"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
mcp = ["dep:rmcp"]

[dependencies]
lenso-cli.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tempfile.workspace = true
clap = { version = "4", features = ["derive"] }
jsonschema = { version = "0.61.2", default-features = false }
tokio-util = { version = "0.7", features = ["rt"] }
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-io"], optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[lints]
workspace = true
