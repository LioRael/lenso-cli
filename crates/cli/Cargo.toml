[package]
name = "lenso"
description = "Run project commands with the Lenso CLI framework"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
include = ["src/**", "Cargo.toml", "README.md"]

[features]
default = ["project"]
project = ["dep:lenso-project"]
ops = ["dep:lenso-ops"]

[dependencies]
lenso-cli.workspace = true
lenso-runtime.workspace = true
lenso-project = { workspace = true, optional = true }
lenso-ops = { workspace = true, optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
semver = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
tar = "0.4"
flate2 = "1"
zip = { version = "8", default-features = false, features = ["deflate"] }
self-replace = "1.5"

[dev-dependencies]
toml.workspace = true

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[lints]
workspace = true
