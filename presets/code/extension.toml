schema_version = 1
id = "code"
version = "0.3.6"
host = ">=0.2.4, <0.3.0"

[dependencies.project]
source = "builtin:project"
version = "^0.1.2"

[handlers."code/select"]
type = "wasm"
module = "code.wasm"
function = "select"
sha256 = "auto"

[handlers."code/select-update"]
type = "wasm"
module = "code.wasm"
function = "select_update"
sha256 = "auto"

[handlers."code/resolve"]
type = "wasm"
module = "code.wasm"
function = "resolve"
fuel = 50000000
sha256 = "auto"

[handlers."code/diff"]
type = "wasm"
module = "code.wasm"
function = "diff"
fuel = 50000000
sha256 = "auto"

[handlers."code/verify"]
type = "wasm"
module = "code.wasm"
function = "verify"
fuel = 50000000
sha256 = "auto"

[handlers."code/search"]
type = "wasm"
module = "code.wasm"
function = "search"
sha256 = "auto"

[[workflows]]
id = "code/search"
steps = [{ id = "search", handler = "code/search" }]

[[workflows]]
id = "code/preview"
steps = [
 { id = "select", handler = "code/select" },
 { id = "resolve", handler = "code/resolve", needs = ["select"] },
 { id = "plan", handler = "project/plan", needs = ["select", "resolve"] },
]

[[workflows]]
id = "code/add"
steps = [
 { id = "select", handler = "code/select" },
 { id = "resolve", handler = "code/resolve", needs = ["select"] },
 { id = "plan", handler = "project/plan", needs = ["select", "resolve"] },
 { id = "apply", handler = "project/apply", needs = ["plan"] },
 { id = "verify", handler = "code/verify", needs = ["resolve", "apply"] },
]

[[workflows]]
id = "code/diff"
steps = [
 { id = "select", handler = "code/select" },
 { id = "resolve", handler = "code/diff", needs = ["select"] },
 { id = "plan", handler = "project/diff", needs = ["select", "resolve"] },
]

[[workflows]]
id = "code/update"
steps = [
 { id = "select", handler = "code/select-update" },
 { id = "resolve", handler = "code/resolve", needs = ["select"] },
 { id = "plan", handler = "project/plan", needs = ["select", "resolve"] },
 { id = "apply", handler = "project/apply", needs = ["plan"] },
 { id = "verify", handler = "code/verify", needs = ["resolve", "apply"] },
]

[[commands]]
path = ["code", "search"]
workflow = "code/search"
about = "Search code resources"
provider = "code"
arguments = [
 { name = "registry", help = "Configured resource registry" },
 { name = "query", help = "Filter resource names and descriptions" },
 { name = "term", help = "Search modules or resources", positional = true },
]

[[commands]]
path = ["code", "preview"]
workflow = "code/preview"
about = "Preview code resources"
provider = "code"
arguments = [
 { name = "registry", help = "Configured resource registry" },
 { name = "item", help = "Catalog resource names", positional = true, kind = "list" },
 { name = "language", help = "Target language" },
 { name = "runtime", help = "Target runtime" },

 { name = "refresh", help = "Preview refreshed directory and source pins", kind = "flag" },
 {name="reconfigure",help="Review changed project conventions for this module",kind="flag"},
]

[[commands]]
path = ["code", "add"]
workflow = "code/add"
about = "Review and add code resources"
provider = "code"
arguments = [
 { name = "registry", help = "Configured resource registry" },
 { name = "item", help = "Catalog resource names", positional = true, kind = "list" },
 { name = "language", help = "Target language" },
 { name = "runtime", help = "Target runtime" },

 {name="reconfigure",help="Review changed project conventions for this module",kind="flag"},
]

[[commands]]
path = ["code", "diff"]
workflow = "code/diff"
about = "Compare code resources without applying changes"
provider = "code"
arguments = [
 { name = "registry", help = "Configured resource registry" },
 { name = "item", help = "Catalog resource names", positional = true, kind = "list" },
 { name = "language", help = "Target language" },
 { name = "runtime", help = "Target runtime" },

]

[[commands]]
path = ["code", "update"]
workflow = "code/update"
about = "Refresh repository pins and review resource updates"
provider = "code"
arguments = [
 { name = "registry", help = "Configured resource registry" },
 { name = "item", help = "Catalog resource names", positional = true, kind = "list" },
 { name = "language", help = "Target language" },
 { name = "runtime", help = "Target runtime" },

 {name="reconfigure",help="Review changed project conventions for this module",kind="flag"},
]

[setup]
configure = "code/configure"

[handlers."code/configure"]
type = "wasm"
module = "code.wasm"
function = "configure"
sha256 = "auto"

[handlers."code/ready"]
type = "wasm"
module = "code.wasm"
function = "ready"
sha256 = "auto"

[[workflows]]
id = "code/configure"
steps = [{ id = "configure", handler = "code/configure" }]

[[workflows]]
id = "code/ready"
steps = [{ id = "ready", handler = "code/ready" }]

[handlers."code/compose"]
type = "wasm"
module = "code.wasm"
function = "compose"
sha256 = "auto"
fuel = 50000000

[[workflows]]
id = "code/compose-preview"
steps = [
 { id = "compose", handler = "code/compose" },
 { id = "plan", handler = "project/plan", needs = ["compose"] },
]

[[workflows]]
id = "code/compose"
steps = [
 { id = "compose", handler = "code/compose" },
 { id = "plan", handler = "project/plan", needs = ["compose"] },
 { id = "apply", handler = "project/apply", needs = ["plan"] },
 { id = "verify", handler = "code/verify", needs = ["compose", "apply"] },
]

[[commands]]
path = ["code", "compose-preview"]
workflow = "code/compose-preview"
about = "Resolve module capabilities and preview a single composition plan"
provider = "code"
arguments = [
 { name = "registry", help = "Configured composition catalog" },
 { name = "module", help = "Root module (or reuse the current composition)", positional = true },
 { name = "sample", help = "Author sample providing complete composition intent" },
 { name = "install", help = "Force native dependency installation or retry", kind = "flag" },
 { name = "refresh", help = "Refresh the pinned catalog repository", kind = "flag" },
 {name="reconfigure",help="Review changed project conventions for this module",kind="flag"},
]

[[commands]]
path = ["code", "compose"]
workflow = "code/compose"
about = "Resolve module instances and review their combined code changes"
provider = "code"
arguments = [
 { name = "registry", help = "Configured composition catalog" },
 { name = "module", help = "Root module (or reuse the current composition)", positional = true },
 { name = "sample", help = "Author sample providing complete composition intent" },
 { name = "install", help = "Force native dependency installation or retry", kind = "flag" },
 { name = "refresh", help = "Refresh the pinned catalog repository", kind = "flag" },
 {name="reconfigure",help="Review changed project conventions for this module",kind="flag"},
]

[handlers."code/validate"]
type = "wasm"
module = "code.wasm"
function = "validate"
sha256 = "auto"
fuel = 50000000

[[workflows]]
id = "code/validate"
steps = [{ id = "validate", handler = "code/validate" }]

[[commands]]
path = ["code", "validate"]
workflow = "code/validate"
about = "Validate author resources, templates and deterministic composition samples"
provider = "code"
arguments = [
 { name = "sample", help = "Validate one named sample within the Host execution budget" },
 { name = "registry", help = "Configured composition catalog" },
 { name = "refresh", help = "Refresh the pinned catalog repository", kind = "flag" },
]

[handlers."code/project-config"]
type="wasm"
module="code.wasm"
function="config"
sha256="auto"
[[workflows]]
id="code/project-config"
steps=[{id="config",handler="code/project-config"},{id="plan",handler="project/plan",needs=["config"]},{id="apply",handler="project/apply",needs=["plan"]}]
[[commands]]
path=["code","config"]
workflow="code/project-config"
provider="code"
about="Read Code project settings or review replacement settings supplied through --input"
arguments=[
 {name="language",help="Set the project language"},
 {name="runtime",help="Set the project runtime"},
 {name="modules-path",help="Generated module root within the configured Code target"},
 {name="import-alias",help="Project import alias"},
 {name="convention",help="Fixed project convention key=value",kind="list"},
 {name="provider",help="Default capability provider contract=module",kind="list"},
]
