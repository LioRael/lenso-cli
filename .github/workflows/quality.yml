name: quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: pnpm install --frozen-lockfile
      - run: npm run check:npm-shim
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - name: Run clean-project Bun integration
        run: cargo test --locked -p lenso-authoring bun_clean_project_add_resolve_reload_and_run_use_the_same_plan -- --ignored --test-threads=1
      - run: cargo package --locked -p lenso-authoring --allow-dirty
      # A release-plz PR can bump lenso-authoring and lenso-cli atomically, but
      # `cargo package` still resolves the CLI dependency from crates.io before
      # the release workflow has published the library. Ordinary PRs and main
      # pushes retain the full CLI payload gate; the release workflow publishes
      # workspace packages in dependency order.
      - name: Package CLI payload
        if: ${{ !startsWith(github.head_ref, 'release-plz-') }}
        run: cargo package --locked -p lenso-cli --allow-dirty --no-verify
