name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0 # v4
        with:
          version: 11.7.0
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.21
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: pnpm install --frozen-lockfile
      - run: npm run check:npm-shim
      - name: Check local contributor tools
        run: tools/contributor/test.sh
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - name: Verify release dependency convergence
        shell: bash
        run: |
          versions=$(cargo metadata --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "lenso-contract-codegen") | .version' \
            | sort -u)
          if [[ $(wc -l <<< "$versions" | tr -d ' ') != "1" ]]; then
            echo "lenso-contract-codegen must resolve to one registry-compatible version; found:"
            echo "$versions"
            exit 1
          fi
      - name: Run clean-room Plugin lifecycles
        run: cargo test --locked -p lenso-cli clean_room_ -- --ignored --test-threads=1
      - name: Detect CLI crate payload changes
        id: cli-crate
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- \
            Cargo.toml Cargo.lock README.md contracts docs/migration-plugin-authoring.md src; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Release PRs run after their pinned provider crates are published.
      # Ordinary CLI payload changes retain a package-content gate here.
      - name: Package CLI payload
        if: ${{ steps.cli-crate.outputs.changed == 'true' && !startsWith(github.head_ref, 'release-plz-') }}
        run: cargo package --locked -p lenso-cli --allow-dirty --no-verify

  windows-authoring:
    name: Windows authoring filesystem semantics
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Verify portable Bundle publication behavior
        run: cargo test --locked -p lenso-cli --lib portable_bundle_
