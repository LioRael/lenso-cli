name: Update Homebrew formula

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homebrew-lenso
  cancel-in-progress: false

jobs:
  formula:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.formula.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Generate from the latest published stable release
        id: formula
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release/homebrew.py --out dist/homebrew/Formula/lenso.rb
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula
          path: dist/homebrew/Formula/lenso.rb
          if-no-files-found: error

  install:
    needs: formula
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula
          path: formula
      - uses: Homebrew/actions/setup-homebrew@6c8c9b048bbf21805ef86bf25324c09e756ee361
      - name: Install and test the candidate formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew tap-new --no-git lenso/ci
          cp formula/lenso.rb "$(brew --repository lenso/ci)/Formula/lenso.rb"
          brew style lenso/ci/lenso
          brew audit --strict lenso/ci/lenso
          brew install lenso/ci/lenso
          brew test lenso/ci/lenso
          brew uninstall lenso/ci/lenso

  update:
    needs: [formula, install]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula
          path: formula
      - uses: actions/checkout@v7
        with:
          repository: LioRael/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - name: Commit the verified formula
        env:
          CLI_VERSION: ${{ needs.formula.outputs.version }}
        run: |
          cp formula/lenso.rb tap/Formula/lenso.rb
          cd tap
          if git diff --quiet -- Formula/lenso.rb && git ls-files --error-unmatch Formula/lenso.rb >/dev/null 2>&1; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/lenso.rb
          git commit -m "chore: update Lenso CLI to $CLI_VERSION"
          git push origin HEAD:main
