name: Publish extension

on:
  push:
    tags: ["code-v*", "shadcn-v*", "app-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Extension to publish
        type: choice
        options: [code, shadcn, app]
        default: code
      register:
        description: Open an official Registry PR using LENSO_REGISTRY_TOKEN
        type: boolean
        default: false
      draft:
        description: Keep the verified release as a draft
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish-extension-${{ github.repository }}-${{ inputs.package || (startsWith(github.ref_name, 'app-v') && 'app' || startsWith(github.ref_name, 'shadcn-v') && 'shadcn' || 'code') }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select package
        id: package
        env:
          REQUESTED: ${{ inputs.package }}
        run: |
          id="$REQUESTED"
          case "$GITHUB_REF_NAME" in code-v*) id=code ;; shadcn-v*) id=shadcn ;; app-v*) id=app ;; esac
          case "$id" in code|shadcn|app) ;; *) exit 1 ;; esac
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Detect an already published version
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ steps.package.outputs.id }}
        run: python3 scripts/check-published-extension.py --id "$PACKAGE_ID"
      - name: Build CLI and Wasm
        env:
          PACKAGE_ID: ${{ steps.package.outputs.id }}
          EXISTING: ${{ steps.existing.outputs.existing }}
        run: |
          rustup toolchain install 1.99.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.99.0 build --locked --release -p lenso
          if [ "$EXISTING" = true ]; then exit 0; fi
          cargo +1.99.0 build --locked --release --target wasm32-unknown-unknown --manifest-path "extensions/$PACKAGE_ID/Cargo.toml"
          mkdir -p "dist/author/$PACKAGE_ID"
          cp "presets/$PACKAGE_ID/extension.toml" "dist/author/$PACKAGE_ID/extension.toml"
          cp "extensions/$PACKAGE_ID/target/wasm32-unknown-unknown/release/lenso_${PACKAGE_ID}.wasm" "dist/author/$PACKAGE_ID/$PACKAGE_ID.wasm"
      - name: Publish verified assets
        id: publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_ID: ${{ steps.package.outputs.id }}
          EXISTING: ${{ steps.existing.outputs.existing }}
          PACKAGE_VERSION: ${{ steps.existing.outputs.version }}
          KEEP_DRAFT: ${{ inputs.draft || false }}
        run: |
          if [ "$EXISTING" = true ]; then
            echo "state=published" >> "$GITHUB_OUTPUT"
            echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          args=(publish --github --id "$PACKAGE_ID" --token-env GITHUB_TOKEN --yes --json)
          if [ "$KEEP_DRAFT" = true ]; then args+=(--draft); fi
          target/release/lenso "${args[@]}"
      - name: Verify published extension in a fresh consumer
        if: steps.publish.outputs.state == 'published' && steps.package.outputs.id == 'code'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/published-cli"
          curl -fsSL --retry 2 "https://github.com/$GITHUB_REPOSITORY/releases/download/v1.0.0/install.sh" \
            -o "$RUNNER_TEMP/published-cli/install.sh"
          sh "$RUNNER_TEMP/published-cli/install.sh" --prefix "$RUNNER_TEMP/published-cli/bin"
          python3 scripts/verify-code-release.py --binary "$RUNNER_TEMP/published-cli/bin/lenso" \
            --repo "$GITHUB_REPOSITORY" --version "$PACKAGE_VERSION" --ref "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/lenso-release-e2e"
      - uses: actions/upload-artifact@v7
        if: steps.publish.outputs.state == 'published' && steps.package.outputs.id == 'code'
        with:
          name: code-release-verification
          path: |
            ${{ runner.temp }}/lenso-release-e2e/verification.json
            ${{ runner.temp }}/lenso-release-e2e/extension-pin.json
            ${{ runner.temp }}/lenso-release-e2e/resources/verification.json
            ${{ runner.temp }}/lenso-release-e2e/native/verification.json
          if-no-files-found: error
      - name: Verify published Shadcn onboarding
        if: steps.publish.outputs.state == 'published' && steps.package.outputs.id == 'shadcn'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.publish.outputs.version }}
        run: |
          python3 scripts/verify-shadcn-release.py --binary target/release/lenso \
            --repo "$GITHUB_REPOSITORY" --version "$PACKAGE_VERSION" --token-env GITHUB_TOKEN
      - name: Submit official Registry record for review
        if: inputs.register && steps.publish.outputs.state == 'published'
        env:
          GH_TOKEN: ${{ secrets.LENSO_REGISTRY_TOKEN }}
          PACKAGE_ID: ${{ steps.package.outputs.id }}
        run: |
          test -n "$GH_TOKEN" || { echo 'LENSO_REGISTRY_TOKEN is required for the optional cross-repository PR'; exit 1; }
          python3 scripts/registry-entry.py --metadata dist/lenso/lenso-release.json \
            --repo "$GITHUB_REPOSITORY" --name "@lenso/$PACKAGE_ID" --submit
