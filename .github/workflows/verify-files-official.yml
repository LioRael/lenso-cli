name: Verify official Files consumers
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/verify-files.py
      - .github/workflows/verify-files-official.yml
permissions:
  contents: read
jobs:
  files:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        language: [typescript, rust]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lenso
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: files
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U lenso -d files"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: Install published native CLI
        run: |
          curl -fsSL --retry 3 --retry-all-errors https://github.com/LioRael/lenso-cli/releases/download/v1.0.0/install.sh -o "$RUNNER_TEMP/install.sh"
          sh "$RUNNER_TEMP/install.sh" --prefix "$RUNNER_TEMP/bin"
      - name: Verify official new projects and real old-version upgrades
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANGUAGE: ${{ matrix.language }}
          DATABASE_URL: postgresql://lenso:test-only-password@127.0.0.1:${{ job.services.postgres.ports[5432] }}/files?sslmode=disable
        run: |
          python3 scripts/verify-files.py --binary "$RUNNER_TEMP/bin/lenso" --official --token-env GITHUB_TOKEN \
            --language "$LANGUAGE" --storage both --out "$RUNNER_TEMP/files-new"
          python3 scripts/verify-files.py --binary "$RUNNER_TEMP/bin/lenso" --official --token-env GITHUB_TOKEN \
            --language "$LANGUAGE" --storage both --upgrade --out "$RUNNER_TEMP/files-upgrade"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: official-files-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/files-new/**/verification.json
            ${{ runner.temp }}/files-upgrade/**/verification.json
          if-no-files-found: warn
