name: Check CLI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Check native workspace and optional composition
        run: |
          python3 scripts/release/test_publish.py
          python3 scripts/release/test_homebrew.py
          cargo +1.99.0 fmt --all --check
          cargo +1.99.0 check --locked --workspace
          cargo +1.99.0 test --locked --workspace
          cargo +1.99.0 test --locked -p lenso --no-default-features
          python3 scripts/test-update-notice.py --binary target/debug/lenso
          cargo +1.99.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Verify real Wasm onboarding
        run: |
          cargo +1.99.0 build --locked -p lenso
          cargo +1.99.0 build --locked --release --target wasm32-unknown-unknown --manifest-path extensions/code/Cargo.toml
          cargo +1.99.0 build --locked --release --target wasm32-unknown-unknown --manifest-path extensions/shadcn/Cargo.toml
          cargo +1.99.0 build --locked --release --target wasm32-unknown-unknown --manifest-path extensions/app/Cargo.toml
          for id in code shadcn app; do
            mkdir -p "dist/author/$id"
            cp "presets/$id/extension.toml" "dist/author/$id/extension.toml"
            cp "extensions/$id/target/wasm32-unknown-unknown/release/lenso_${id}.wasm" "dist/author/$id/$id.wasm"
            target/debug/lenso package --id "$id" --out "dist/mainline/$id" --json
          done
          python3 scripts/test-onboarding.py
          python3 scripts/test-code-project-config.py
          python3 scripts/test-code-initialization.py
          python3 scripts/build-demo.py
          python3 scripts/test-demo.py
          python3 scripts/test-agent-protocol.py

  ops:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
      RUSTUP_TOOLCHAIN: "1.99.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Prepare Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy
      - name: Verify optional Ops with real Node and Rust processes
        run: |
          cargo test --locked -p lenso-ops
          cargo build --locked -p lenso --features ops
          cp target/debug/lenso target/debug/lenso-with-ops
          cargo build --locked -p lenso --no-default-features
          cp target/debug/lenso target/debug/lenso-core
          LENSO_BIN="$PWD/target/debug/lenso-with-ops" LENSO_CORE_BIN="$PWD/target/debug/lenso-core" LENSO_OPS_REPORT=ops-acceptance.json python3 scripts/test-ops.py 2>&1 | tee ops-acceptance.log
      - name: Preserve Ops acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ops-acceptance-linux
          path: |
            ops-acceptance.json
            ops-acceptance.log

  extensions:
    strategy:
      matrix:
        extension: [code, app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Prepare Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check pure extension logic
        env:
          EXTENSION: ${{ matrix.extension }}
        run: |
          cargo +1.99.0 fmt --manifest-path extensions/$EXTENSION/Cargo.toml --check
          cargo +1.99.0 check --locked --manifest-path extensions/$EXTENSION/Cargo.toml --all-targets
          cargo +1.99.0 test --locked --manifest-path extensions/$EXTENSION/Cargo.toml
          cargo +1.99.0 clippy --locked --manifest-path extensions/$EXTENSION/Cargo.toml --all-targets --all-features -- -D warnings
