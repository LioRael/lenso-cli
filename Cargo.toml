[package]
name = "lenso-authoring"
version = "0.1.1"
edition.workspace = true
license.workspace = true
publish = true
repository.workspace = true
description = "Authoring CLI and composition resolver for Lenso vNext."

[[bin]]
name = "lenso"
path = "src/main.rs"

[dependencies]
lenso-app-plan = { path = "../lenso-app-plan", version = "0.1.0" }
lenso-bun-adapter = { path = "../lenso-bun-adapter", version = "0.1.1" }
lenso-contract-codegen = { path = "../lenso-contract-codegen", version = "0.1.0" }
lenso-kernel = { path = "../lenso-kernel", version = "0.1.1" }
lenso-runner = { path = "../lenso-runner", version = "0.1.1" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
lenso-capability-greeting = { path = "../lenso-capability-greeting" }
lenso-native-adapter = { path = "../lenso-native-adapter" }
lenso-native-greeter = { path = "../../fixtures/vnext-native-greeter" }

[lints]
workspace = true
