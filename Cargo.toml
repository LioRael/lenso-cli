[package]
name = "lenso-cli"
version = "0.4.9"
edition = "2024"
license = "MIT"
description = "Authoring CLI for Lenso Plugins and App intent."
repository = "https://github.com/LioRael/lenso-cli"
homepage = "https://github.com/LioRael/lenso-cli"
rust-version = "1.94"
categories = ["command-line-utilities", "development-tools"]
keywords = ["cli", "authoring", "plugins", "app-plan"]
include = [
    "/src/**/*.rs",
    "/contracts/*.json",
    "/docs/migration-plugin-authoring.md",
    "/README.md",
    "/Cargo.toml",
]

[[bin]]
name = "lenso"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "lenso_app_authoring"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:lenso-contract-authoring-next",
    "dep:lenso-contract-codegen-next",
    "dep:lenso-kernel",
    "dep:lenso-runner",
    "dep:lenso-runtime-codec",
    "dep:lenso-wasm-component-adapter",
    "dep:nix",
    "dep:notify",
    "dep:serde",
    "dep:tokio",
    "dep:url",
]

[workspace]
resolver = "2"
members = []

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-cli"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }
tempfile = "3.23"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"], optional = true }
lenso-app-plan = { version = "0.3.0" }
lenso-contract-authoring-next = { package = "lenso-contract-authoring", version = "0.1.1", optional = true }
lenso-contract-codegen-next = { package = "lenso-contract-codegen", version = "0.6.4", optional = true }
lenso-kernel = { version = "0.2.0", optional = true }
lenso-plugin-bundle = { version = "0.2.0" }
lenso-runner = { version = "0.2.0", optional = true }
lenso-runtime-codec = { version = "0.2.0", optional = true }
lenso-wasm-component-adapter = { version = "0.2.0", optional = true }
notify = { version = "8.2", optional = true }
semver = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = "1.0"
sha2 = "0.11"
rustix = { version = "1.1", features = ["fs"] }
tempfile.workspace = true
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"], optional = true }
toml.workspace = true
uuid = { version = "1", features = ["v7"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = { version = "2.5", optional = true }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"], optional = true }

[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.19", features = ["kernel"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
