[package]
name = "lenso-cli"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "Authoring CLI for Lenso Plugins and App intent."
repository = "https://github.com/LioRael/lenso-cli"
homepage = "https://github.com/LioRael/lenso-cli"
rust-version = "1.94"
categories = ["command-line-utilities", "development-tools"]
keywords = ["cli", "authoring", "plugins", "app-plan"]
include = [
    "/src/**/*.rs",
    "/contracts/*.json",
    "/docs/migration-plugin-authoring.md",
    "/docs/typescript-host-authoring.md",
    "/docs/verified-plugin-archives.md",
    "/docs/local-plugin-discovery.md",
    "/docs/capability-authoring.md",
    "/docs/convention-authoring.md",
    "/docs/engine.md",
    "/README.md",
    "/Cargo.toml",
]

[[bin]]
name = "lenso"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "lenso_app_authoring"
path = "src/lib.rs"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tokio", "dep:lenso-engine", "dep:lenso-engine-app", "dep:lenso-engine-markdown", "dep:lenso-engine-runtime"]

[workspace]
resolver = "2"
members = []

[dependencies]
anyhow = "1.0"
serde_json = "1.0"
clap = { version = "4", features = ["derive", "string"], optional = true }
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "signal"], optional = true }
lenso-engine-authoring = { version = "0.1.0" }
lenso-engine = { version = "0.1.1", optional = true }
lenso-engine-app = { version = "0.1.0", optional = true }
lenso-engine-markdown = { version = "0.1.0", optional = true }
lenso-engine-runtime = { version = "0.1.0", optional = true }

[dev-dependencies]
lenso-app-plan = "0.4.1"
lenso-plugin-bundle = "0.4.2"
tempfile = "3.23"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.30", features = ["signal"] }
