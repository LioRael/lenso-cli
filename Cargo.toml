[package]
name = "lenso-cli"
version = "0.4.7"
edition = "2024"
license = "MIT"
description = "Authoring CLI for Lenso Plugins and App intent."
repository = "https://github.com/LioRael/lenso-cli"
homepage = "https://github.com/LioRael/lenso-cli"
rust-version = "1.94"
categories = ["command-line-utilities", "development-tools"]
keywords = ["cli", "authoring", "plugins", "app-plan"]
include = [
    "/src/**/*.rs",
    "/docs/migration-plugin-authoring.md",
    "/README.md",
    "/Cargo.toml",
]

[[bin]]
name = "lenso"
path = "src/main.rs"

[workspace]
resolver = "2"
members = []

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-cli"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }
tempfile = "3.23"
toml = "0.9"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
lenso-app-plan = { version = "0.2.0", git = "https://github.com/LioRael/lenso", rev = "d95e2240e83e9f4b90139a48ca97e067376f4fa9" }
lenso-bun-adapter = "0.1.2"
lenso-contract-authoring-next = { package = "lenso-contract-authoring", version = "0.1.1", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
lenso-contract-codegen-next = { package = "lenso-contract-codegen", version = "0.6.3", git = "https://github.com/LioRael/lenso-protocols", rev = "239381609da51158d0aae5991bc0d074f742ef42" }
lenso-kernel = { version = "0.1.12", git = "https://github.com/LioRael/lenso", rev = "d95e2240e83e9f4b90139a48ca97e067376f4fa9" }
lenso-plugin-bundle = { version = "0.1.3", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "6709c8dd02bfaf1cc83ca85f1446a91dc7069b8d" }
lenso-runner = { version = "0.1.10", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "6709c8dd02bfaf1cc83ca85f1446a91dc7069b8d" }
lenso-runtime-codec = { version = "0.1.2", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "6709c8dd02bfaf1cc83ca85f1446a91dc7069b8d" }
lenso-wasm-component-adapter = { version = "0.1.3", git = "https://github.com/LioRael/lenso-runtime-rust", rev = "6709c8dd02bfaf1cc83ca85f1446a91dc7069b8d" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile.workspace = true
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml.workspace = true
uuid = { version = "1", features = ["v7"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
