[package]
name = "lenso-cli"
version = "0.2.27"
edition = "2024"
license = "MIT"
description = "Lenso command-line interface for scaffolding and operating Lenso backend projects."
repository = "https://github.com/LioRael/lenso-cli"
homepage = "https://github.com/LioRael/lenso-cli"
rust-version = "1.94"
categories = ["command-line-utilities", "development-tools"]
keywords = ["cli", "scaffold", "backend", "framework"]
include = [
    "src/**/*.rs",
    "templates/**",
    "README.md",
    "Cargo.toml",
]

[[bin]]
name = "lenso"
path = "src/main.rs"

[workspace]
resolver = "2"
members = ["crates/lenso-authoring"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-cli"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.52", features = ["io-util", "macros", "net", "process", "rt", "signal", "time"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[patch."https://github.com/LioRael/lenso"]
lenso-app-plan = "0.1.0"
lenso-contract-codegen = "0.1.0"
lenso-kernel = "0.1.1"
lenso-native-adapter = "0.1.1"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
include_dir = "0.7"
lenso-service = "0.1"
lenso-contracts = "0.4.0"
lenso-module-management = "0.2.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rpassword = "7"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "json", "uuid"] }
thiserror = "2"
tokio = { version = "1.52", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "1", features = ["v7"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal"] }

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = "warn"
pedantic = "warn"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
