[package]
name = "lenso-code"
version = "0.3.0"
edition = "2024"
publish = false
[lib]
crate-type = ["cdylib"]
[dependencies]
extism-pdk = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = { version = "0.25", features = ["serde"] }
lenso-composition = { path = "../../crates/composition" }
lenso-codegen = { path = "../../crates/codegen" }
sha2 = "0.10"
similar = "2"
[workspace]
[profile.release]
opt-level = "s"
strip = true
lto = true
